<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>TideCrew forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify detects forms in static HTML at deploy time; the Angular app posts here. -->
<form name="tienda-aviso" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="tienda-aviso">
  <input name="bot-field">
  <input type="email" name="email">
  <input type="text" name="idioma">
</form>
</body></html>
